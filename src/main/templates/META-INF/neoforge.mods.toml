modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
#logoFile = ".png"
authors = "anbubu"

description='''
optimises egregious algorithms in atm10sky mods that tank the server tps
'''

[[mixins]]
config = "${mod_id}.megacells.mixins.json"
requiredMods = ["megacells"]

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "megacells"
    type = "required"
    versionRange = "[4.11.0,4.11.1)"
    ordering = "AFTER"
    side = "BOTH"